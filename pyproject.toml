[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow"
version = "0.4.0"
description = "Local-first Research OS for AI-assisted scientific research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
rf = "researchflow.cli:main"

[tool.setuptools.packages.find]
include = ["researchflow*"]

[tool.setuptools.data-files]
"share/researchflow/schemas" = ["schemas/*.schema.json"]
"share/researchflow/skills/retrieve-before-reason" = ["skills/retrieve-before-reason/SKILL.md"]
"share/researchflow/skills/literature-query" = ["skills/literature-query/SKILL.md"]
"share/researchflow/skills/paper-deep-read" = ["skills/paper-deep-read/SKILL.md"]
"share/researchflow/skills/code-evidence-query" = ["skills/code-evidence-query/SKILL.md"]
"share/researchflow/skills/hypothesis-focus" = ["skills/hypothesis-focus/SKILL.md"]
"share/researchflow/skills/experiment-design" = ["skills/experiment-design/SKILL.md"]
"share/researchflow/skills/experiment-review" = ["skills/experiment-review/SKILL.md"]
"share/researchflow/skills/experiment-run" = ["skills/experiment-run/SKILL.md"]
"share/researchflow/skills/result-analysis" = ["skills/result-analysis/SKILL.md"]
"share/researchflow/skills/daily-log" = ["skills/daily-log/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
